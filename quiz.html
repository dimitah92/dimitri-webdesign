<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português · Quiz du jour</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8; --paper: #fffdf7; --ink: #1a1612; --ink2: #4a4540; --ink3: #8a8480;
  --green: #2d6a3f; --green-bg: #eaf3ec; --red: #8b2020; --red-bg: #f8eaea;
  --yellow: #c8860a; --yellow-bg: #fdf3e0; --blue: #1a4a7a; --border: #d8d0c0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Mono', monospace; background: var(--bg); color: var(--ink);
  min-height: 100vh; display: flex; flex-direction: column;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(26,22,18,0.04) 28px);
}

header {
  background: var(--ink); color: var(--bg);
  padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
}
.h-left { display: flex; align-items: flex-end; gap: 10px; }
.h-flag { font-size: 1.5rem; }
.h-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 900; letter-spacing: -0.5px; }
.h-date { font-size: 0.65rem; opacity: 0.45; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }
.score-badge {
  font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 900;
  color: var(--green); background: rgba(63,185,80,0.12); padding: 3px 11px; border-radius: 4px;
}

.prog-wrap { background: var(--paper); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.prog-track { flex: 1; height: 5px; background: var(--border); }
.prog-fill { height: 100%; background: var(--ink); transition: width 0.35s ease; }
.prog-label { font-size: 0.7rem; color: var(--ink3); white-space: nowrap; }

/* MODE TABS */
.mode-bar { background: var(--paper); border-bottom: 2px solid var(--border); padding: 0; display: flex; }
.mode-tab {
  flex: 1; padding: 10px 6px; border: none; background: transparent;
  font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 500;
  color: var(--ink3); cursor: pointer; transition: all 0.12s;
  border-bottom: 3px solid transparent; text-transform: uppercase; letter-spacing: 0.5px;
}
.mode-tab:hover { color: var(--ink); }
.mode-tab.active { color: var(--ink); border-bottom-color: var(--ink); }

.main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; }

/* DAY BANNER */
.day-banner {
  width: 100%; max-width: 560px; background: var(--yellow-bg);
  border: 1px solid #e8d08a; padding: 10px 16px; margin-bottom: 16px;
  font-size: 0.78rem; color: var(--yellow); display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.day-banner strong { color: var(--ink); }

/* CARD */
.card {
  background: var(--paper); border: 1px solid var(--border); border-left: 5px solid var(--border);
  width: 100%; max-width: 560px; padding: 22px 20px 18px;
  box-shadow: 0 2px 14px rgba(26,22,18,0.07);
  animation: pop 0.2s ease both;
}
@keyframes pop { from { opacity:0; transform:translateY(7px) scale(0.99); } to { opacity:1; transform:none; } }
.card.state-ok { border-left-color: var(--green); background: var(--green-bg); }
.card.state-ko { border-left-color: var(--red); background: var(--red-bg); }

.card-meta { font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--ink3); margin-bottom: 5px; display: flex; gap: 8px; }
.card-cat { color: var(--yellow); font-weight: 600; }
.card-prompt { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 700; color: var(--ink); margin-bottom: 14px; line-height: 1.45; }
.card-prompt em { font-style: italic; font-weight: 400; color: var(--ink2); }
.card-q { font-family: 'Fraunces', serif; font-size: 1rem; color: var(--ink2); margin-bottom: 14px; line-height: 1.5; }

/* CONJ */
.conj-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.conj-row { display: flex; align-items: center; gap: 10px; }
.pronoun { font-size: 0.78rem; color: var(--ink3); font-weight: 500; min-width: 66px; }
.conj-input {
  flex: 1; background: transparent; border: none; border-bottom: 1.5px solid var(--border);
  color: var(--blue); font-family: 'DM Mono', monospace; font-size: 0.88rem; font-weight: 500;
  padding: 3px 4px; outline: none; transition: border-color 0.15s;
}
.conj-input:focus { border-bottom-color: var(--ink); }
.conj-input.ok { color: var(--green); border-bottom-color: var(--green); }
.conj-input.ko { color: var(--red); border-bottom-color: var(--red); text-decoration: line-through; opacity: 0.6; }
.fix { font-size: 0.76rem; color: var(--green); font-weight: 600; margin-left: 2px; }

/* TROU */
.trou-line { font-family: 'Fraunces', serif; font-size: 1rem; line-height: 2.8; margin-bottom: 14px; }
.blank {
  display: inline-block; background: transparent; border: none; border-bottom: 2px solid var(--blue);
  color: var(--blue); font-family: 'DM Mono', monospace; font-size: 0.86rem; font-weight: 500;
  width: 96px; padding: 1px 4px; outline: none; text-align: left; transition: border-color 0.15s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Scrolling placeholder on focus */
.blank:focus { animation: none; }
@keyframes scroll-hint {
  0%   { text-indent: 0; }
  50%  { text-indent: -40px; }
  100% { text-indent: 0; }
}
.blank:focus { border-bottom-color: var(--ink); }
.blank.ok { border-bottom-color: var(--green); color: var(--green); }
.blank.ko { border-bottom-color: var(--red); color: var(--red); text-decoration: line-through; opacity: 0.6; }
.ifix { font-size: 0.76rem; color: var(--green); font-weight: 600; margin-left: 3px; }

/* TRAD / WORD */
.word-big { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 16px; }
.answer-input {
  width: 100%; padding: 10px 12px; background: transparent; border: 1.5px solid var(--border);
  color: var(--ink); font-family: 'DM Mono', monospace; font-size: 0.9rem;
  outline: none; transition: border-color 0.15s; margin-bottom: 12px;
}
.answer-input:focus { border-color: var(--ink); }
.answer-input.ok { border-color: var(--green); color: var(--green); }
.answer-input.ko { border-color: var(--red); text-decoration: line-through; opacity: 0.6; }

/* Strikethrough for wrong answers — replaces the input */
.strike-wrong {
  display: inline-block;
  color: var(--red);
  text-decoration: line-through;
  opacity: 0.55;
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 3px 6px;
  background: rgba(139,32,32,0.07);
  border-radius: 4px;
  vertical-align: middle;
}
.strike-block {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--red);
  border-radius: 0;
  margin-bottom: 10px;
  font-size: 0.88rem;
}

/* CHOICES */
.choices { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.choice {
  padding: 9px 13px; border: 1px solid var(--border); background: transparent;
  color: var(--ink); font-family: 'DM Mono', monospace; font-size: 0.85rem;
  text-align: left; cursor: pointer; transition: all 0.12s; white-space: pre-line;
}
.choice:hover:not([disabled]) { border-color: var(--ink); background: var(--yellow-bg); }
.choice.sel { border-color: var(--blue); background: #eaf0fa; color: var(--blue); }
.choice.right { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 500; }
.choice.wrong-pick { border-color: var(--red); background: var(--red-bg); color: var(--red); }

/* FEEDBACK */
.feedback { padding: 11px 14px; font-size: 0.84rem; line-height: 1.55; border-left: 3px solid; margin-bottom: 14px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.feedback.ko { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.fr-trans { margin-top: 5px; font-family: 'Fraunces', serif; font-style: italic; font-size: 0.9rem; color: var(--ink2); }
.pt-trans { margin-top: 7px; font-family: 'Fraunces', serif; font-size: 0.92rem; font-weight: 600; color: var(--blue); border-left: 3px solid var(--blue); padding-left: 8px; }
.note-line { font-size: 0.74rem; color: var(--ink3); margin-top: 4px; }

/* BTNS */
.btn-row { display: flex; gap: 8px; margin-top: 4px; }
.btn { padding: 9px 20px; border: none; font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
.btn-check { background: var(--ink); color: var(--bg); }
.btn-next  { background: var(--green); color: #fff; }
.btn:hover { opacity: 0.78; }

/* END SCREEN */
.end-screen { text-align: center; padding: 36px 20px; max-width: 420px; }
.end-big { font-family: 'Fraunces', serif; font-size: 3.5rem; font-weight: 900; color: var(--green); }
.end-sub { font-family: 'Fraunces', serif; font-size: 1.1rem; color: var(--ink2); margin-top: 6px; }
.end-msg { font-size: 0.82rem; color: var(--ink3); margin-top: 10px; line-height: 1.7; }
.btn-restart { margin-top: 20px; display: inline-block; background: var(--ink); color: var(--bg); padding: 10px 24px; font-family: 'DM Mono', monospace; font-size: 0.82rem; cursor: pointer; border: none; }
.btn-restart2 { margin-top: 10px; display: inline-block; background: transparent; color: var(--ink); border: 1px solid var(--border); padding: 9px 20px; font-family: 'DM Mono', monospace; font-size: 0.78rem; cursor: pointer; }

@media (max-width: 600px) {
  body { font-size: 14px; }
  header { padding: 12px 14px 10px; gap: 10px; }
  .h-flag { font-size: 1.3rem; }
  .h-title { font-size: 1rem; }
  .score-badge { font-size: 1rem; padding: 2px 9px; }
  .prog-wrap { padding: 7px 12px; gap: 8px; }
  .mode-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .mode-tab { font-size: 0.62rem; padding: 8px 4px; white-space: nowrap; flex-shrink: 0; min-width: 0; }
  .main { padding: 10px 10px 60px; }
  .card { padding: 14px 12px 12px; }
  .card-prompt { font-size: 0.9rem; margin-bottom: 10px; }
  .card-q { font-size: 0.88rem; margin-bottom: 10px; }
  .card-meta { font-size: 0.6rem; }
  .word-big { font-size: 1.55rem; margin-bottom: 12px; }
  .conj-rows { gap: 10px; }
  .conj-row { gap: 6px; }
  .pronoun { min-width: 52px; font-size: 0.73rem; }
  .conj-input { font-size: 0.84rem; padding: 5px 4px; }
  .fix { font-size: 0.72rem; }
  .trou-line { font-size: 0.88rem; line-height: 3.2; }
  .blank { width: 78px; font-size: 0.8rem; }
  .answer-input { padding: 12px 10px; font-size: 0.88rem; margin-bottom: 8px; }
  .choices { gap: 9px; }
  .choice { padding: 12px 11px; font-size: 0.83rem; }
  .btn { padding: 12px 16px; font-size: 0.8rem; width: 100%; text-align: center; }
  .btn-row { flex-direction: column; gap: 6px; }
  .feedback { font-size: 0.8rem; padding: 10px 11px; }
  .fr-trans { font-size: 0.84rem; }
  .note-line { font-size: 0.72rem; }
  .day-banner { font-size: 0.73rem; padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
  .day-banner button { padding: 5px 10px; font-size: 0.68rem; }
  .end-screen { padding: 24px 12px 50px; }
  .end-big { font-size: 2.5rem; }
  .end-sub { font-size: 0.95rem; }
  .btn-restart, .btn-restart2 { width: 100%; text-align: center; display: block; padding: 12px 16px; box-sizing: border-box; }
  .btn-restart2 { margin-top: 8px; }
}
</style>
</head>
<body>

<header>
  <div class="h-left">
    <div class="h-flag">🇧🇷</div>
    <div>
      <div class="h-title">Quiz du jour</div>
      <div class="h-date" id="h-date">—</div>
      <div style="margin-top:3px;display:inline-block;background:#2d6a3f;color:#a8f0b8;font-size:0.62rem;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:3px">v24 · 23/09/2026</div>
    </div>
  </div>
  <div class="score-badge" id="score-badge">0/0</div>
</header>

<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="prog-label" id="prog-label">0 / 15</div>
</div>

<div class="mode-bar">
  <button class="mode-tab active" id="tab-day"  onclick="setMode('day',this)">📅 30 du jour</button>
  <button class="mode-tab" id="tab-all"  onclick="setMode('all',this)">🌐 Tout</button>
  <button class="mode-tab" id="tab-conj" onclick="setMode('conjugaison',this)">📝 Conjugaison</button>
  <button class="mode-tab" id="tab-voc"  onclick="setMode('vocabulaire',this)">📦 Vocabulaire</button>
  <button class="mode-tab" id="tab-trad" onclick="setMode('traduction',this)">🔄 Traduction</button>
</div>

<div class="main" id="main"></div>

<script>
// ─── ALL EXERCISES ───────────────────────────────────────────────
const ALL_EX = [
  // CONJUGAISON (Eu / Você / Nós / Vocês — pas de Tu)
  { id:'c1', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>chamar-se</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['me chamo','se chama','nos chamamos','se chamam'], pt:'Eu me chamo / Você se chama / Nós nos chamamos / Vocês se chamam.',
    fr:'falar = parler ✦ me appelle / s\'appelle / nous appelons / s\'appellent' },
  { id:'c2', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>acordar-se</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['me acordo','se acorda','nos acordamos','se acordam'], pt:'Eu me acordo / Você se acorda / Nós nos acordamos / Vocês se acordam.',
    fr:'acordar-se = se réveiller ✦ me réveille / se réveille / nous réveillons / se réveillent' },
  { id:'c3', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>lembrar-se</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['me lembro','se lembra','nos lembramos','se lembram'], pt:'Eu me lembro / Você se lembra / Nós nos lembramos / Vocês se lembram.',
    fr:'lembrar-se = se souvenir ✦ me souviens / se souvient / nous souvenons / se souviennent' },
  { id:'c4', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>enganar-se</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['me engano','se engana','nos enganamos','se enganam'], pt:'Eu me engano / Você se engana / Nós nos enganamos / Vocês se enganam.',
    fr:'enganar-se = se tromper ✦ me trompe / se trompe / nous trompons / se trompent' },
  { id:'c5', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>conhecer</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['conheço','conhece','conhecemos','conhecem'], pt:'Eu conheço / Você conhece / Nós conhecemos / Vocês conhecem.',
    fr:'conhecer = connaître ✦ conheço / conhece / conhecemos / conhecem' },
  { id:'c6', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>ser</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['sou','é','somos','são'], pt:'Eu sou / Você é / Nós somos / Vocês são.',
    fr:'ser = être (permanent) ✦ sou / é / somos / são' },
  { id:'c7', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>estar</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['estou','está','estamos','estão'], pt:'Eu estou / Você está / Nós estamos / Vocês estão.',
    fr:'suis / est / sommes / sont' },
  { id:'c8', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>ter</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['tenho','tem','temos','têm'], pt:'Eu tenho / Você tem / Nós temos / Vocês têm.',
    fr:'ter = avoir ✦ tenho / tem / temos / têm' },
  { id:'c9', cat:'conjugaison', type:'conj', prompt:'Conjugue au présent : <em>ficar</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['fico','fica','ficamos','ficam'], pt:'Eu fico / Você fica / Nós ficamos / Vocês ficam.',
    fr:'ficar = rester/devenir ✦ fico / fica / ficamos / ficam' },
  { id:'c10', cat:'conjugaison', type:'conj', prompt:'Gérondif — <em>estar + trabalhar</em>',
    pronouns:['Eu','Você','Nós','Vocês'], answers:['estou trabalhando','está trabalhando','estamos trabalhando','estão trabalhando'], pt:'Eu estou trabalhando / Você está trabalhando / Nós estamos trabalhando / Vocês estão trabalhando.',
    fr:'suis / est / sommes / sont en train de travailler' },

  // TEXTES À TROUS
  { id:'t1', cat:'trou', type:'trou', prompt:'Contractions — complète :',
    parts:['Eu vou ',' padaria e depois vou ',' cinema.'], answers:['à','ao'], hints:['a+a','a+o'],
    fr:'Je vais à la boulangerie et ensuite au cinéma.' },
  { id:'t2', cat:'trou', type:'trou', prompt:'Contractions — complète :',
    parts:['Estou ',' casa ',' minha mãe.'], answers:['na','da'], hints:['em+a','de+a'],
    fr:'Je suis à la maison de ma mère.' },
  { id:'t3', cat:'trou', type:'trou', prompt:'ser ou morar ? Complète :',
    parts:['Ela ',' professora primária e ',' em La Rochelle.'], answers:['é','mora'], hints:['ser ou estar ?','morar ou estar ?'], pt:'Ela é professora primária e mora em La Rochelle.',
    fr:'Elle est professeure des écoles et habite à La Rochelle.' },
  { id:'t4', cat:'trou', type:'trou', prompt:'ser ou estar avec adjectif ?',
    parts:['Ela ',' feliz — de nature.\nEla ',' feliz — en ce moment.'], answers:['é','está'], hints:['durable','ponctuel'], pt:'Ela é feliz. / Ela está feliz.',
    fr:'Elle est heureuse (de nature). Elle est heureuse (en ce moment).' },
  { id:'t5', cat:'trou', type:'trou', prompt:'gostar + DE — complète :',
    parts:['Eu gosto ',' chocolate e ',' correr na praia.'], answers:['de','de'], hints:['quelle préposition ?','quelle préposition ?'], pt:'Eu gosto de chocolate e de correr na praia.',
    fr:'J\'aime le chocolat et courir sur la plage.' },
  { id:'t6', cat:'trou', type:'trou', prompt:'Contractions por — complète :',
    parts:['Obrigado ',' flores! Parabéns ',' casamento!'], answers:['pelas','pelo'], hints:['por+as','por+o'],
    fr:'Merci pour les fleurs ! Félicitations pour le mariage !' },
  { id:'t7', cat:'trou', type:'trou', prompt:'Article défini — complète :',
    parts:['É ',' meu celular e é ',' minha garrafa de água.'], answers:['o','a'], hints:['masc.','fém.'], pt:'É o meu celular e é a minha garrafa de água.',
    fr:'C\'est mon portable et c\'est ma bouteille d\'eau.' },
  { id:'t8', cat:'trou', type:'trou', prompt:'<em>desde</em>, <em>há</em> ou <em>faz</em> ? Complète :',
    parts:['Moro em Paris ','  2014. \nEla trabalha aqui ','  três anos. \nFico aqui ','  a semana passada.'],
    answers:['desde','há','desde'], hints:['date précise → ?','durée → ?','moment précis → ?'], pt:'Moro em Paris desde 2014. Ela trabalha aqui há três anos. Fico aqui desde a semana passada.',
    fr:'J\'habite Paris depuis 2014. Elle travaille ici depuis trois ans. Je reste ici depuis la semaine dernière. ✦ desde + moment précis / há + durée' },
  { id:'t9', cat:'trou', type:'trou', prompt:'<em>Este / Esse / Aquele</em> — complète selon la distance :',
    parts:['','  é meu amigo (juste à côté).\n','  é meu colega (un peu plus loin).\n','  é meu professor (là-bas).'],
    answers:['Este','Esse','Aquele'], hints:['ce/cet (juste là) → ?','celui-là → ?','celui là-bas → ?'], pt:'Este é meu amigo. Esse é meu colega. Aquele é meu professor.',
    fr:'Celui-ci est mon ami. Celui-là est mon collègue. Celui là-bas est mon prof.' },
  { id:'t10', cat:'trou', type:'trou', prompt:'Pluriel — complète :',
    parts:['Um jornal → dois ','.\nUma cor → três ','.\nUm hotel → vários ','.'],
    answers:['jornais','cores','hotéis'], hints:['-al→-ais','-r→-res','-el→-éis'], pt:'Um jornal → dois jornais. Uma cor → três cores. Um hotel → vários hotéis.',
    fr:'Un journal → deux journaux. Une couleur → trois couleurs. Un hôtel → plusieurs hôtels.' },
  { id:'t11', cat:'trou', type:'trou', prompt:'Pluriel + accord des adjectifs — complète :',
    parts:['O jornal é francês → Os jornais são ','.\nO hotel é agradável → Os hotéis são ','.'],
    answers:['franceses','agradáveis'], hints:['-ês→-eses','-el→-eis'], pt:'Os jornais são franceses. Os hotéis são agradáveis.',
    fr:'Les journaux sont français. Les hôtels sont agréables.' },

  // TRADUCTION

// ─── HELPERS ─────────────────────────────────────────────────────
function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function norm(s){
  return (s||'').trim().toLowerCase()
    .replace(/[àâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[îï]/g,'i')
    .replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/ç/g,'c')
    .replace(/ã/g,'a').replace(/õ/g,'o').replace(/á/g,'a').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/â/g,'a').replace(/ê/g,'e').replace(/ô/g,'o')
    .replace(/[.,!?'"«»]/g,'').replace(/\s+/g,' ');
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function isOk(ex, inputs){
  if(ex.type==='conj'||ex.type==='trou') return ex.answers.every((a,i)=>norm(inputs[i]||'')===norm(a));
  if(ex.type==='trad'||ex.type==='word'){
    const u=norm(inputs[0]||'');
    if(u===norm(ex.answer)) return true;
    return (ex.accept||[]).some(a=>norm(a)===u);
  }
  if(ex.type==='choix') return inputs[0]===ex.answer;
  return false;
}

// ─── SRS (RÉPÉTITION ESPACÉE) ────────────────────────────────────
// Stored in localStorage: { [exId]: { streak: 0-N, due: timestamp, seen: N } }
// streak: consecutive correct answers
// due: next time this exercise should appear (timestamp ms)
// seen: total times answered

const SRS_KEY = 'quiz_srs_v1';

function srsLoad(){
  try { return JSON.parse(localStorage.getItem(SRS_KEY)||'{}'); }
  catch(e){ return {}; }
}
function srsSave(data){
  try { localStorage.setItem(SRS_KEY, JSON.stringify(data)); } catch(e){}
}

function srsUpdate(exId, wasCorrect){
  const data = srsLoad();
  const rec = data[exId] || { streak:0, due:0, seen:0 };
  rec.seen++;
  if(wasCorrect){
    rec.streak++;
  } else {
    rec.streak = 0;
  }
  // Due date: longer interval as streak grows
  // streak 0 = now (always show), 1 = 1h, 2 = 6h, 3 = 1d, 4 = 3d, 5+ = 7d
  const intervals = [0, 1, 6, 24, 72, 168]; // hours
  const hours = intervals[Math.min(rec.streak, intervals.length-1)];
  rec.due = Date.now() + hours * 3600000;
  data[exId] = rec;
  srsSave(data);
}

function srsGetWeight(ex){
  // Combine lesson recency weight with SRS weight
  const lessonW = WEIGHTS[ex.id] || 1;
  const data = srsLoad();
  const rec = data[ex.id];

  if(!rec || rec.seen === 0){
    // Never seen — high priority
    return lessonW * 3;
  }
  const now = Date.now();
  if(now < rec.due){
    // Not due yet — drastically reduce (already mastered recently)
    const mastered = rec.streak >= 3;
    return mastered ? 0 : Math.max(1, lessonW - 1);
  }
  // Due — weight by how wrong / unseen
  if(rec.streak === 0) return lessonW * 4;  // got wrong last time → max priority
  if(rec.streak === 1) return lessonW * 3;
  if(rec.streak === 2) return lessonW * 2;
  return lessonW; // streak ≥ 3 but due → normal weight
}

function srsWeightedPool(indices){
  const pool = [];
  indices.forEach(i => {
    const w = srsGetWeight(ALL_EX[i]);
    for(let k=0; k<w; k++) pool.push(i);
  });
  return pool;
}

function srsWeightedSample(indices, n){
  const pool = srsWeightedPool(indices);
  // If pool is empty (all mastered), fall back to all
  const workPool = pool.length > 0 ? pool : indices.map(i=>i);
  const result = [];
  const used = new Set();
  const shuffled = shuffle(workPool);
  for(const idx of shuffled){
    if(!used.has(idx)){ used.add(idx); result.push(idx); }
    if(result.length >= n) break;
  }
  // Fill any remaining from all indices
  if(result.length < n){
    for(const idx of shuffle(indices)){
      if(!used.has(idx)){ used.add(idx); result.push(idx); }
      if(result.length >= n) break;
    }
  }
  return result;
}

function seededShuffle(arr, seed){
  const a = [...arr];
  let s = seed;
  for(let i=a.length-1;i>0;i--){
    s = (s*1664525+1013904223)&0xffffffff;
    const j = Math.abs(s)%(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function updateBar(){

  document.getElementById('prog-label').textContent = `${answered} / ${total}`;

function showCurrent(){
  updateBar();
  const main = document.getElementById('main');
  if(cur >= queue.length){ showEnd(main); return; }
  const ex = ALL_EX[queue[cur]];
  main.innerHTML = dayBanner() + buildCard(ex);
  const first = main.querySelector('input');
  if(first) first.focus();
  main.querySelectorAll('input[data-i]').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryCheck(); });
    // Add title tooltip for full hint text
    if(inp.placeholder) inp.title = inp.placeholder;
    // Scroll placeholder if too long: animate via focus/blur
    inp.addEventListener('focus', function(){
      if(this.value === '' && this.placeholder && this.placeholder.length > 12){
        this._ph = this.placeholder;
        let pos = 0;
        const padded = this.placeholder + '   ';
        this._scroll = setInterval(()=>{
          pos = (pos+1) % padded.length;
          this.placeholder = padded.slice(pos) + padded.slice(0, pos);
        }, 120);
      }
    });
    inp.addEventListener('blur', function(){
      if(this._scroll){ clearInterval(this._scroll); this._scroll=null; }
      if(this._ph) this.placeholder = this._ph;
    });
  });
}

function dayBanner(){
  if(mode!=='day') return '';
  const d = new Date();
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','jun','jul','août','sep','oct','nov','déc'];
  const label = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById('h-date').textContent = label;

  // SRS stats
  const data = srsLoad();
  const total = ALL_EX.length;
  const mastered = ALL_EX.filter(e => {
    const rec = data[e.id];
    return rec && rec.streak >= 3 && Date.now() < rec.due;
  }).length;
  const never = ALL_EX.filter(e => !data[e.id] || data[e.id].seen === 0).length;
  const srsInfo = `<span style="opacity:0.7;font-size:0.68rem">✅ ${mastered} maîtrisées · ❓ ${never} jamais vues · 📚 ${total} total</span>`;

  return `<div class="day-banner">📅 <span><strong>Session du jour</strong> — ${label} — 30 questions<br>${srsInfo}</span><button onclick="reshuffleDay()" style="margin-left:auto;background:var(--yellow);border:none;padding:5px 12px;font-family:'DM Mono',monospace;font-size:0.72rem;font-weight:600;cursor:pointer;color:#fff;flex-shrink:0">🔀 Nouvelles questions</button></div>`;

      body += `<div class="conj-row"><span class="pronoun">${p}</span><input data-i="${i}" autocomplete="off" spellcheck="false" inputmode="text" placeholder="…"></div>`;
    });
    body += '</div>';
  } else if(ex.type==='trou'){
    body += '<div class="trou-line">';
    ex.parts.forEach((part,i)=>{
      body += part.replace(/\n/g,'<br>');
      if(i < ex.answers.length)
        body += `<input class="blank" data-i="${i}" placeholder="${(ex.hints&&ex.hints[i])||'…'}" autocomplete="off" spellcheck="false" inputmode="text">`;
    });
    body += '</div>';
  } else if(ex.type==='trad'){
    body += `<input class="answer-input" data-i="0" placeholder="Ta traduction en portugais…" autocomplete="off" spellcheck="false" inputmode="text">`;
    return `<div class="card" id="the-card">
      <div class="card-meta"><span>Q ${cur+1}/${queue.length}</span><span class="card-cat">${label}</span></div>
      <div class="card-prompt">${ex.prompt}</div>
      <div class="card-q">${esc(ex.q||'')}</div>
      ${body}
      <div class="feedback" id="feedback"></div>
      <div class="btn-row" id="btn-row">
        <button class="btn btn-check" onclick="tryCheck()">Vérifier</button>
      </div>
    </div>`;
  } else if(ex.type==='word'){
    // flipped: show French word, ask Portuguese / normal: show PT, ask FR
    let displayWord, ph, promptText;
    if(flipped){
      displayWord = ex.answer; // show French
      promptText = 'Traduis en portugais :';
      ph = 'Traduction en portugais…';
    } else {
      displayWord = ex.q; // show Portuguese
      promptText = 'Traduis en français :';
      ph = 'Traduction en français…';
    }
    body += `<div class="word-big">${esc(displayWord)}</div>`;
    body += `<input class="answer-input" data-i="0" placeholder="${ph}" autocomplete="off" spellcheck="false" inputmode="text">`;
    body += `<input type="hidden" id="flip-state" value="${flipped?'1':'0'}">`;
    return `<div class="card" id="the-card">
      <div class="card-meta"><span>Q ${cur+1}/${queue.length}</span><span class="card-cat">${label}</span></div>
      <div class="card-prompt">${promptText}</div>
      ${body}
      <div class="feedback" id="feedback"></div>
      <div class="btn-row" id="btn-row">
        <button class="btn btn-check" onclick="tryCheck()">Vérifier</button>
      </div>
    </div>`;
  } else if(ex.type==='choix'){
    body += '<div class="choices">';
    ex.choices.forEach((c,i)=>{
      body += `<button class="choice" onclick="pickChoice(${i})">${esc(c)}</button>`;
    });
    body += '</div>';
  }

  const showQ = ex.type!=='word' && ex.type!=='choix';
  return `<div class="card" id="the-card">
    <div class="card-meta"><span>Q ${cur+1}/${queue.length}</span><span class="card-cat">${label}</span></div>
    <div class="card-prompt">${ex.prompt}</div>
    ${showQ ? `<div class="card-q">${esc(ex.q||'')}</div>` : ''}
    ${body}
    <div class="feedback" id="feedback"></div>
    <div class="btn-row" id="btn-row">
      ${ex.type!=='choix' ? `<button class="btn btn-check" onclick="tryCheck()">Vérifier</button>` : ''}
    </div>
  </div>`;
}

function pickChoice(i){
  choiceSel = i;
  document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('sel', j===i));
  const row = document.getElementById('btn-row');
  if(!row.querySelector('.btn-check'))
    row.innerHTML = `<button class="btn btn-check" onclick="tryCheck()">Vérifier</button>`;
}

function tryCheck(){
  const ex = ALL_EX[queue[cur]];
  const flipped = !!flips[cur];
  let inputs;
  if(ex.type==='choix'){
    if(choiceSel===null) return;
    inputs = [choiceSel];
  } else {
    inputs = [];
    document.querySelectorAll('#the-card input[data-i]').forEach(el=>inputs[+el.dataset.i]=el.value);
  }

  // For flipped word: correct answer is the PT word (ex.q), not ex.answer (FR)
  let ok;
  if(ex.type==='word' && flipped){
    const u = norm(inputs[0]||'');
    ok = norm(ex.q)===u || (ex.accept||[]).some(a=>norm(a)===u);
  } else {
    ok = isOk(ex, inputs);
  }

  if(ok) correct++;
  answered++;
  // Update SRS memory for this exercise
  srsUpdate(ALL_EX[queue[cur]].id, ok);
  updateBar();

  // style inputs
  if(ex.type==='conj'||ex.type==='trou'){
    document.querySelectorAll('#the-card input[data-i]').forEach((el,i)=>{
      const good = norm(el.value||'')===norm(ex.answers[i]);
      el.readOnly=true;
      if(good){
        el.classList.add('ok');
      } else {
        // Replace input with a struck-through span + correct answer
        const wrapper = el.parentNode;
        const wrongVal = el.value || '—';
        const strike = document.createElement('span');
        strike.className = 'strike-wrong';
        strike.textContent = wrongVal;
        wrapper.replaceChild(strike, el);
        const fix = document.createElement('span');
        fix.className = 'fix';
        fix.textContent = '→ ' + ex.answers[i];
        wrapper.appendChild(fix);
      }
    });
  } else if(ex.type==='trad'||ex.type==='word'){
    const el=document.querySelector('#the-card input[data-i="0"]');
    if(ok){
      el.classList.add('ok'); el.readOnly=true;
    } else {
      const wrongVal = el.value || '—';
      const strike = document.createElement('span');
      strike.className = 'strike-wrong strike-block';
      strike.textContent = wrongVal;
      el.parentNode.replaceChild(strike, el);
    }
  } else if(ex.type==='choix'){
    document.querySelectorAll('.choice').forEach((b,j)=>{
      b.disabled=true;
      if(j===ex.answer) b.classList.add('right');
      else if(j===choiceSel) b.classList.add('wrong-pick');
    });
    choiceSel=null;
  }

  // Build correct answer display for feedback
  let correctDisplay;
  if(ex.type==='word' && flipped) correctDisplay = ex.q;
  else if(ex.type==='choix') correctDisplay = ex.choices[ex.answer];
  else if(ex.display) correctDisplay = ex.display;
  else correctDisplay = ex.answer;

  // feedback
  const fb = document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'ko');
  // Show streak badge
  const rec = srsLoad()[ALL_EX[queue[cur]].id] || {streak:0};
  const streakBadge = ok
    ? `<span style="float:right;font-size:0.75rem;opacity:0.8">${['','🔥','🔥🔥','⭐','⭐⭐','🏆'][Math.min(rec.streak,5)]||'🏆'} ${rec.streak}× correct</span>`
    : `<span style="float:right;font-size:0.75rem;opacity:0.8">↩ priorité max</span>`;
  let msg = (ok ? '✓ Parfait ! ' : `✗ ${(ex.type!=='conj'&&ex.type!=='trou')?'Réponse : <strong>'+correctDisplay+'</strong>':'Quelques erreurs.'}`) + streakBadge;
  if((ex.type==='trou'||ex.type==='conj') && ex.pt) msg += `<div class="pt-trans">🇧🇷 ${ex.pt}</div>`;
  if(ex.fr) msg += `<div class="fr-trans" style="clear:both">🇫🇷 ${ex.fr}</div>`;
  if(ex.frNote) msg += `<div class="note-line">📝 ${ex.frNote}</div>`;
  if(ex.note) msg += `<div class="note-line">📝 ${ex.note}</div>`;
  fb.innerHTML = msg;
  document.getElementById('the-card').classList.add(ok?'state-ok':'state-ko');
  document.getElementById('btn-row').innerHTML = `<button class="btn btn-next" onclick="nextQ()">Question suivante →</button>`;
}

function nextQ(){ cur++; showCurrent(); }

function showEnd(main){
  const pct = queue.length ? Math.round(correct/queue.length*100) : 0;
  const emoji = pct===100?'🏆':pct>=70?'💪':pct>=40?'📚':'🔄';
  main.innerHTML = `<div class="end-screen">
    <div class="end-big">${emoji}</div>
    <div class="end-big" style="font-size:2.5rem;margin-top:8px">${correct}/${queue.length}</div>
    <div class="end-sub">${pct}% de réussite</div>
    <div class="end-msg">${pct===100?'Impeccável! Tu maîtrises tout ça 🎉':pct>=70?'Muito bem! Continue comme ça, boa sorte!':'Revois les points en rouge et recommence — você consegue!'}</div>
    <br>
    <button class="btn-restart" onclick="restart()">🔀 Recommencer (mélangé)</button><br>
    ${mode==='day'?`<button class="btn-restart2" onclick="setMode('all',document.getElementById('tab-all'))">Tout faire (${ALL_EX.length} questions)</button>`:''}
  </div>`;
}

function restart(){ buildQueue(); cur=0; correct=0; answered=0; showCurrent(); }

function reshuffleDay(){
  buildQueue();
  showCurrent();
}

document.getElementById('h-date').textContent = (()=>{
  const d=new Date();
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['jan','fév','mar','avr','mai','jun','jul','août','sep','oct','nov','déc'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
})();

buildQueue();
showCurrent();
